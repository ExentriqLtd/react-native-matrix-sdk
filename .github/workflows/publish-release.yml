name: Publish (GitHub release)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate
        uses: ./.github/actions/generate
        with:
          platform: android
          release: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-libs
          path: android/src/main/jniLibs/**/*.so
          if-no-files-found: error

  ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate
        uses: ./.github/actions/generate
        with:
          platform: ios
          release: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcframework
          path: build/*.xcframework
          if-no-files-found: error

  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JS
        uses: ./.github/actions/setup-js

      # Packed before the binaries land in the tree, so the tarball stays small:
      # its postinstall fetches binaries.tar.gz from this repo's release.
      - name: Pack npm tarball
        run: |
          yarn prepare
          npm pack --ignore-scripts
          ls -l *.tgz

      - name: Download Android libs
        uses: actions/download-artifact@v4
        with:
          name: android-libs
          path: android/src/main/jniLibs

      - name: Download xcframework
        uses: actions/download-artifact@v4
        with:
          name: xcframework
          path: build

      - name: Package binaries
        run: |
          node scripts/package-binaries.js
          tar -tzf binaries.tar.gz | head -n 20

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "$VERSION" binaries.tar.gz ./*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Built by CI from $GITHUB_SHA (matrix-rust-sdk rev from ubrn.yaml)."
